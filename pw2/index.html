<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Store & Beyond — Hero Section</title>

  <!-- Підключення шрифту Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Хедер / Верхній рядок -->
  <header class="header">
    <div class="container header__container">
      <a href="#" class="header__logo">
        <img src="assets/Vector.svg" alt="Petworld logo" class="logo-icon">
        <span class="logo-text">PETWORLD</span>
      </a>

      <nav class="nav">
        <a href="#" class="nav__link">Sign Up</a>
        <a href="#" class="btn btn--login">Log in</a>
      </nav>
    </div>
  </header>

  <!-- Головний контент -->
  <main>
    <!-- Hero Секція -->
    <section class="hero">
      <div class="container hero__container">
        
        <div class="hero__content">
          <h1 class="hero__title">Pet Store<br>&amp; Beyond</h1>
          <p class="hero__subtitle">
            This is a sample landing page, created with Figma and Anima. No coding involved.
          </p>
          <a href="#" class="btn btn--primary">Get Started</a>
        </div>

        <div class="hero__media">
          <img src="assets/dogs.png" alt="Two dogs in stylish outfits" class="hero__img">
        </div>

      </div>
    </section>

    <!-- Секція з відео -->
    <section class="video-section">
      <div class="container video-section__container">
        <div class="video-card">
          <img src="assets/video.png" alt="Video preview" class="video-card__preview">
        </div>
      </div>
    </section>
  </main>

</body>
</html>
